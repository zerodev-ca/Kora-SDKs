name: Release SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Package to release (all, node, python, java, fivem)"
        required: true
        default: "all"

jobs:
  release-node:
    if: inputs.target == 'all' || inputs.target == 'node' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: cd packages/node && npm install && npm run build
      - working-directory: packages/node
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version > /dev/null 2>&1; then
            echo "Version already published, skipping."
            exit 0
          fi
          npm stage publish --provenance --access public

  release-python:
    if: inputs.target == 'all' || inputs.target == 'python' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade build
      - run: cd packages/python && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true

  github-release:
    if: inputs.target == 'all' || inputs.target == 'java' || inputs.target == 'fivem' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p 'require("./packages/node/package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.tag.outputs.tag }}" > /dev/null 2>&1 || gh release create "${{ steps.tag.outputs.tag }}" --target "${{ github.sha }}" --title "${{ steps.tag.outputs.tag }}" --generate-notes

  release-java:
    needs: github-release
    if: inputs.target == 'all' || inputs.target == 'java' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: cd packages/java && mvn clean package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.github-release.outputs.tag }}" packages/java/target/*.jar --clobber

  release-fivem:
    needs: github-release
    if: inputs.target == 'all' || inputs.target == 'fivem' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd packages
          zip -r kora-fivem.zip fivem
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.github-release.outputs.tag }}" packages/kora-fivem.zip --clobber
