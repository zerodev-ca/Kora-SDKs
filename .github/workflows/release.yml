name: Release SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Package to release (all, node, python, java, fivem, go, dotnet, rust)"
        required: true
        default: "all"

jobs:
  release-node:
    if: inputs.target == 'all' || inputs.target == 'node' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: cd packages/node && npm install && npm run build
      - working-directory: packages/node
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version > /dev/null 2>&1; then
            echo "Version already published, skipping."
            exit 0
          fi
          npm stage publish --provenance --access public

  release-python:
    if: inputs.target == 'all' || inputs.target == 'python' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade build
      - run: cd packages/python && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true

  github-release:
    if: inputs.target == 'all' || inputs.target == 'java' || inputs.target == 'fivem' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p 'require("./packages/node/package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.tag.outputs.tag }}" > /dev/null 2>&1 || gh release create "${{ steps.tag.outputs.tag }}" --target "${{ github.sha }}" --title "${{ steps.tag.outputs.tag }}" --generate-notes

  release-java:
    needs: github-release
    if: inputs.target == 'all' || inputs.target == 'java' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: cd packages/java && mvn clean package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.github-release.outputs.tag }}" packages/java/target/*.jar --clobber

  release-fivem:
    needs: github-release
    if: inputs.target == 'all' || inputs.target == 'fivem' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd packages
          zip -r kora-fivem.zip fivem
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.github-release.outputs.tag }}" packages/kora-fivem.zip --clobber

  release-go:
    if: inputs.target == 'all' || inputs.target == 'go' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
      - run: cd packages/go && go vet ./... && go build ./...
      - run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="v$(node -p 'require("./packages/node/package.json").version')"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/packages/go/$version" > /dev/null; then
            echo "Tag already exists, skipping."
            exit 0
          fi
          git tag "packages/go/$version" "${{ github.sha }}"
          git push origin "packages/go/$version"
          curl -sf --retry 5 --retry-all-errors "https://proxy.golang.org/github.com/zerodev-ca/!kora-!s!d!ks/packages/go/v3/@v/$version.info"

  release-dotnet:
    if: inputs.target == 'all' || inputs.target == 'dotnet' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet pack packages/dotnet/Kora -c Release -o packages/dotnet/dist
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "packages/dotnet/dist/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-rust:
    if: inputs.target == 'all' || inputs.target == 'rust' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo package
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, the Rust SDK was not published."
            exit 0
          fi
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -sf -A "kora-sdks-release" "https://crates.io/api/v1/crates/zerodev-kora/$version" > /dev/null; then
            echo "Version already published, skipping."
            exit 0
          fi
          cargo publish
