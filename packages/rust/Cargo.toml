[package]
name = "zerodev-kora"
version = "3.1.0"
edition = "2021"
description = "Official Rust SDK for Kora licensing"
license = "MIT"
repository = "https://github.com/zerodev-ca/Kora-SDKs"

[lib]
name = "kora"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
